<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Estris's app icon: the bento box in white on a near-black squircle, on macOS's
       1024 grid (an 824 body with a soft shadow). The same drawing as the menu bar icon
       (MenuBarIcon.swift), on a 24 grid scaled by 20. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2C2E"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g transform="translate(272 272) scale(20)" fill="#FFFFFF">
    <rect x="3" y="3" width="8" height="18" rx="2"/>
    <rect x="13" y="3" width="8" height="8" rx="2"/>
    <rect x="13" y="13" width="8" height="8" rx="2"/>
  </g>
</svg>
