# Builds the app on every pull request that touches its code, for both Apple silicon and
# Intel as a release does, so a change that doesn't compile is caught before it is merged.
name: Build macOS

on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/build-macos.yml"

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The same macOS and Xcode as a release.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Use the latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build macOS
        working-directory: macos
        run: swift build -c release --arch arm64 --arch x86_64
