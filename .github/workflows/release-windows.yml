# Publishes a new Windows version: bumps it, turns the changelog's Unreleased entries into its
# notes, builds the installers with Velopack, commits, tags and creates the GitHub release.
# Run it from Actions > Release Windows > Run workflow, on main. Optional signing secrets:
# WINDOWS_CERTIFICATE (base64 .pfx) and WINDOWS_CERTIFICATE_PASSWORD; without them Windows warns
# when opening the installer (SmartScreen).
#
# Versions go to windows-vX.Y.Z, never marked as the repo's latest release: the Mac's updates and
# download button read `releases/latest`. Installed copies and the website read the rolling
# windows-latest release, whose files are replaced each time.
name: Release Windows

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency: release-windows

jobs:
  release:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          echo "::error::Run the release from main."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Velopack's packer
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Bump the version and the changelog
        id: version
        run: python scripts/release.py "${{ inputs.bump }}" build/release-notes.md | tee -a "$GITHUB_OUTPUT"
        env:
          PYTHONUTF8: 1

      - name: Import the signing certificate
        id: signing
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "::warning::No WINDOWS_CERTIFICATE secret: the installer isn't signed and SmartScreen warns about it."
            exit 0
          fi
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.pfx"
          echo "params=/f $RUNNER_TEMP/certificate.pfx /p $CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256" >> "$GITHUB_OUTPUT"

      - name: Build the installers
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_PARAMS: ${{ steps.signing.outputs.params }}
        run: ./scripts/make-installer.sh

      - name: Commit, tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release Windows $VERSION"
          git tag "windows-v$VERSION"
          git push origin HEAD:main "windows-v$VERSION"
          gh release create "windows-v$VERSION" build/releases/* --latest=false --title "Estris for Windows $VERSION" --notes-file build/release-notes.md
          if ! gh release view windows-latest > /dev/null 2>&1; then
            gh release create windows-latest --latest=false --target main --title "Estris for Windows" --notes "The latest version of Estris for Windows."
          fi
          gh release upload windows-latest build/releases/* --clobber
