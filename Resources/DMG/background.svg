<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- The disk image window's background: icons sit at (180, 190) and (480, 190), drawn by Finder. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="1" stop-color="#ececf1"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <text x="330" y="70" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Drag Estris to Applications</text>
  <path d="M262 190 C 300 160, 360 160, 398 186" fill="none" stroke="#a1a1a6" stroke-width="4" stroke-linecap="round"/>
  <path d="M384 172 L 400 188 L 378 194" fill="none" stroke="#a1a1a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="352" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#6e6e73">Or open it from here: Estris offers to move itself.</text>
</svg>
